# VB-WH-1 vulnerable: validating webhook that fails OPEN over all resources
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata: {name: vb-gate}
webhooks:
- name: gate.vb-bench.example.com
  failurePolicy: Ignore
  sideEffects: None
  admissionReviewVersions: ["v1"]
  clientConfig:
    service: {name: vb-gate, namespace: vb-bench, path: /validate}
  rules:
  - apiGroups: ["*"]
    apiVersions: ["*"]
    operations: ["CREATE", "UPDATE"]
    resources: ["*"]
