# VB-SEC-1 safe twin: credential in a Secret only; ConfigMap holds no secrets
apiVersion: v1
kind: ConfigMap
metadata: {name: vb-app-settings, namespace: vb-bench}
data:
  database_host: "db.vb-bench.svc:5432"
---
apiVersion: v1
kind: Secret
metadata: {name: vb-app-config, namespace: vb-bench}
stringData:
  api_key: "vb-canary-key-ok"
  database_password: "vb-canary-password-1"
