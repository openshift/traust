# VB-SEC-1 vulnerable: credential in a ConfigMap (world-readable to ns viewers)
# The credential is planted as discrete keys, not a connection URL, so forge
# secret-scanning does not raise a "connection string" alert on a benchmark
# canary; the oracle greps the canary password string either way.
apiVersion: v1
kind: ConfigMap
metadata: {name: vb-app-settings, namespace: vb-bench}
data:
  database_host: "db.vb-bench.svc:5432"
  database_name: "app"
  database_user: "admin"
  database_password: "vb-canary-password-1"
---
apiVersion: v1
kind: Secret
metadata: {name: vb-app-config, namespace: vb-bench}
stringData: {api_key: "vb-canary-key-ok"}
