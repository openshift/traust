# VB-WH-1 safe twin: fails CLOSED, scoped to one resource in one namespace
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata: {name: vb-gate}
webhooks:
- name: gate.vb-bench.example.com
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1"]
  namespaceSelector:
    matchLabels: {vb-bench/gated: "true"}
  clientConfig:
    service: {name: vb-gate, namespace: vb-bench, path: /validate}
  rules:
  - apiGroups: ["apps"]
    apiVersions: ["v1"]
    operations: ["CREATE", "UPDATE"]
    resources: ["deployments"]
