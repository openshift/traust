- id: K8S_INGRESS_SSL_PROTOCOLS_LEGACY
  kind: regex
  category: Middleware
  severity: high
  risk: non-quantum-risk
  confidence: 0.80
  migration_hint: Restrict Ingress TLS protocols to TLS 1.2+.
  pattern: "nginx\\.ingress\\.kubernetes\\.io/ssl-protocols\\s*:\\s*['\"]?[^\\n\"]*TLSv1(?:\\.0|\\.1)?(?:$|[^0-9.])"
  scope: config
  description: Legacy TLS is enabled in a Kubernetes Ingress annotation.

- id: K8S_INGRESS_RSA_CIPHERS
  kind: regex
  category: Middleware
  severity: high
  risk: quantum-vulnerable
  confidence: 0.70
  migration_hint: Remove RSA key-exchange dependency from Ingress cipher suites.
  pattern: "nginx\\.ingress\\.kubernetes\\.io/ssl-ciphers\\s*:\\s*['\"]?[^\\n\"]*(RSA|DES-CBC3-SHA|3DES|RC4)"
  scope: config
  description: RSA or weak cipher suites are configured in a Kubernetes Ingress annotation.

- id: K8S_GATEWAYAPI_TLSV1
  kind: regex
  category: Middleware
  severity: high
  risk: non-quantum-risk
