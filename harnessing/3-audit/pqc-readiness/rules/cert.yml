- id: CERT_RSA_SIGNATURE
  kind: certificate
  category: PKI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.72
  migration_hint: Migrate to ML-DSA or hybrid certificate chains.
  pattern: "(?i)sha(1|224|256|384|512)WithRSAEncryption|1\\.2\\.840\\.113549\\.1\\.1\\.(5|11|12|13)"
  scope: certificate
  description: Certificate signed with an RSA-based algorithm detected.

- id: CERT_SHA1_SIGNATURE
  kind: certificate
  category: PKI
  severity: critical
  risk: non-quantum-risk
  confidence: 0.85
  migration_hint: Upgrade certificate signatures to SHA-256 or stronger.
  pattern: "(?i)sha1WithRSAEncryption|1\\.2\\.840\\.113549\\.1\\.1\\.5"
  scope: certificate
  description: SHA-1 certificate signature detected.

- id: CERT_RSA_1024
  kind: certificate
  category: PKI
  severity: critical
  risk: non-quantum-risk
  confidence: 0.88
  migration_hint: Use 3072-bit+ keys or migrate to PQC.
  pattern: "\\b1024\\b"
  scope: certificate
  description: Certificate with a 1024-bit key detected.

