id: python
kind: language
display_name: Python
in_plain_english: >
  Python's ssl module wraps the system OpenSSL. PQ TLS capability is
  entirely determined by the linked OpenSSL version — Python itself
  adds no PQ logic. Requires OpenSSL 3.5+ for ML-KEM support.
