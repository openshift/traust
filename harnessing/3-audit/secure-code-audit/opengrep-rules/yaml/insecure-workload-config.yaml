# yaml config-defaults tranche (v1.5) — auth-disable toggles shipped
# insecure in helm values / docker-compose / operator CR samples
# (fn-analysis.md §4 config/DSN class; §6 miss-reason A).
rules:
  # Derived from: b-lite delta aap-log-generator — "Unauthenticated API
  # exposed externally by default" via chart/aap-mock/values.yaml defaults
  # (arm-B high; the audit under-rated the shipped default), and the
  # fn-analysis §6 miss-reason A "disabled-auth toggles defaulting
  # insecure in shipped env/config" class.
  - id: traust-yaml-insecure-workload-config-auth-disabled
    languages: [yaml]
    severity: ERROR
    message: >-
      Shipped configuration disables authentication (or enables anonymous
      access) by default — every deployment that keeps the default
      exposes the service unauthenticated. Default to auth on; make any
      insecure toggle an explicit, documented opt-out. CWE-306.
    metadata:
      cwe: ["CWE-306"]
      category: insecure-workload-config
      asvs: ["V1"]
      confidence: MEDIUM
      references:
        - "measured miss class: fn-analysis §6 miss-reason A (config/manifest scope); b-lite sxs-2026-07 aap-log-generator-delta (unauthenticated-by-default chart values, arm-B high vs audit medium)"
        - "recalibrated 2026-07-29: 0.00 campaign precision over 11 judged decisions — dismissal reason was duplication with the k8s hardening scanner (KHS-* facts are authoritative for manifests per SKILL.md pre-scan contract item 5); rule now scoped to NON-k8s YAML (documents carrying apiVersion are excluded), keeping helm values / docker-compose / plain config in scope"
    patterns:
      # k8s-manifest scoping: any document with an apiVersion key is
      # scan_k8s_hardening territory (KHS-* facts authoritative) — this
      # rule owns only non-k8s YAML (helm values, compose, app config)
      - pattern-not-inside: |
          apiVersion: $APIV
          ...
      - pattern-either:
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(auth(entication)?[_-]?(enabled|required)|require[_-]?auth(entication)?|enable[_-]?auth(entication)?)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(false|no|off|0)['"]?$
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(auth(entication)?[_-]?disabled?|disable[_-]?auth(entication)?|no[_-]?auth|anonymous[_-]?(auth|access|enabled)|allow[_-]?anonymous)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(true|yes|on|1)['"]?$
          # nested toggle blocks (auth:/authentication: enabled: false)
          - pattern: |
              auth:
                enabled: false
          - pattern: |
              authentication:
                enabled: false
          # compose/env `- KEY=value` list form (polarity-aware)
          - pattern-regex: (?i)^\s*-\s*['"]?(AUTH(ENTICATION)?_(ENABLED|REQUIRED)|REQUIRE_AUTH|ENABLE_AUTH(ENTICATION)?)\s*=\s*['"]?(false|no|off|0)['"]?\s*$
          - pattern-regex: (?i)^\s*-\s*['"]?(DISABLE_AUTH(ENTICATION)?|AUTH(ENTICATION)?_DISABLED?|NO_AUTH|ANONYMOUS_(AUTH|ACCESS)|ALLOW_ANONYMOUS)\s*=\s*['"]?(true|yes|on|1)['"]?\s*$
