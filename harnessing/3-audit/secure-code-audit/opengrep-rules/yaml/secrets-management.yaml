# yaml config-defaults tranche (v1.5) — default/empty credentials shipped
# in helm values / docker-compose / operator CR samples (fn-analysis.md §4
# config/DSN class, ~75% measured FN rate).
rules:
  # Derived from: b-lite delta trustify-helm-charts — "Hardcoded PostgreSQL
  # application password committed in deployment values profiles"
  # (values-ocp-no-aws.yaml, missed by the audit) and "Keycloak admin
  # password 'admin123456'"; b-lite playbook-dispatcher armB — "Hardcoded
  # default PSK credentials in OpenShift deploy template"
  # (deploy/clowdapp.yaml) + docker-compose developer credentials.
  - id: traust-yaml-secrets-management-default-password
    languages: [yaml]
    severity: ERROR
    message: >-
      A well-known default password ships in this configuration file —
      every deployment that keeps the default is enterable with a
      guessable credential, and committed defaults routinely reach
      production unchanged. Require the value at install time (generated
      secret, required chart value) instead of shipping one. CWE-1392.
    metadata:
      cwe: ["CWE-1392", "CWE-798"]
      category: secrets-management
      asvs: ["V2"]
      confidence: MEDIUM
      references:
        - "measured miss: b-lite sxs-2026-07 trustify-helm-charts-delta (hardcoded Postgres password in values profile; Keycloak admin123456)"
        - "measured miss: b-lite sxs-2026-07 playbook-dispatcher-armB (default PSK in deploy/clowdapp.yaml + docker-compose.yml)"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?[\w.-]*(password|passwd|pwd|passphrase)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(admin(123(456)?)?|password1?|passw0rd|changeme|change[_-]?me|changeit|secret|letmein|welcome1?|root|guest|test|redhat|postgres|mysql|qwerty|12345678?9?0?)['"]?$
          # compose/env `- KEY=value` list form
          - pattern-regex: (?i)^\s*-\s*['"]?\w*(PASSWORD|PASSWD|PWD)\s*=\s*(admin(123(456)?)?|password1?|passw0rd|changeme|change[_-]?me|changeit|secret|letmein|welcome1?|root|guest|test|redhat|postgres|mysql|qwerty|12345678?9?0?)['"]?\s*$

  # Derived from: the docker-mysql confirmed TP class (b-lite
  # docker-mysql-delta: blank MySQL root password + remote root access,
  # audit FIND-001 CWE-306/1392/798) generalized to shipped chart/compose
  # defaults — the empty-required-secret shape of the same config-defaults
  # miss class (fn-analysis §8 fix #1: "empty required secrets").
  - id: traust-yaml-secrets-management-empty-password
    languages: [yaml]
    severity: WARNING
    message: >-
      A password/credential field ships empty (or empty-password mode is
      explicitly allowed) in this configuration — deployments that keep
      the default may run with a blank credential. Verify whether the
      empty value means "generated at install" (fine) or "blank accepted"
      (finding). CWE-1392.
    metadata:
      cwe: ["CWE-1392", "CWE-521"]
      category: secrets-management
      asvs: ["V2"]
      confidence: LOW
      references:
        - "measured miss class: b-lite sxs-2026-07 docker-mysql-delta (blank root password class, audit-confirmed TP shape) generalized per fn-analysis §8 fix #1"
        - "recalibrated 2026-07-29: 0.00 campaign precision over 10 judged decisions — dismissal reason was duplication with the k8s hardening scanner (KHS-* facts are authoritative for manifests per SKILL.md pre-scan contract item 5); rule now scoped to NON-k8s YAML (documents carrying apiVersion are excluded), keeping helm values / docker-compose / plain config in scope"
    patterns:
      # k8s-manifest scoping: any document with an apiVersion key is
      # scan_k8s_hardening territory (KHS-* facts authoritative) — this
      # rule owns only non-k8s YAML (helm values, compose, app config)
      - pattern-not-inside: |
          apiVersion: $APIV
          ...
      - pattern-either:
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?[\w.-]*(password|passwd|pwd|passphrase)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: ^(""|'')$
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(mysql|mariadb|postgres(ql)?)?_?allow_?empty_?(root_?)?password['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(true|yes|on|1)['"]?$
          # compose/env `- KEY=value` list form
          - pattern-regex: (?i)^\s*-\s*['"]?\w*ALLOW_EMPTY(_ROOT)?_PASSWORD\s*=\s*['"]?(true|yes|on|1)['"]?\s*$
