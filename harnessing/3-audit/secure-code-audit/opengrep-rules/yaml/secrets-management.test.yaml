# Fixtures for the yaml secrets-management config-defaults rules. All
# values synthetic.
keycloak:
  # ruleid: traust-yaml-secrets-management-default-password
  adminPassword: admin123456
  # ok: traust-yaml-secrets-management-default-password
  realm: trust

postgres:
  # ruleid: traust-yaml-secrets-management-default-password
  password: "changeme"
  # ok: traust-yaml-secrets-management-default-password
  passwordSecretRef: app-db-credentials
  # ok: traust-yaml-secrets-management-default-password
  password2: "{{ .Values.global.dbPassword }}"

compose_environment:
  # ruleid: traust-yaml-secrets-management-default-password
  - POSTGRES_PASSWORD=postgres
  # ok: traust-yaml-secrets-management-default-password
  - POSTGRES_PASSWORD=${DB_PASSWORD}

emptydefaults:
  # ruleid: traust-yaml-secrets-management-empty-password
  password: ""
  # ruleid: traust-yaml-secrets-management-empty-password
  MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  # ok: traust-yaml-secrets-management-empty-password
  username: ""

mysql_env:
  # ruleid: traust-yaml-secrets-management-empty-password
  - MYSQL_ALLOW_EMPTY_PASSWORD=yes
  # ok: traust-yaml-secrets-management-empty-password
  - MYSQL_ALLOW_EMPTY_PASSWORD=no

# k8s-manifest scoping (2026-07-29): documents carrying apiVersion are
# scan_k8s_hardening territory (KHS-* authoritative) — the empty-password
# rule emits no facts here. (The default-password rule is deliberately
# NOT k8s-scoped: it holds 0.67 campaign precision on manifests.)
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
stringData:
  # ok: traust-yaml-secrets-management-empty-password
  password: ""
