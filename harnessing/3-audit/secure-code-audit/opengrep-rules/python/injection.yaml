rules:
  - id: traust-python-injection-subprocess-shell
    languages: [python]
    severity: ERROR
    message: >-
      Shell execution with a run-time-composed command string — any
      interpolated value becomes shell syntax. Use an argument list with
      shell=False. CWE-78.
    metadata:
      cwe: ["CWE-78"]
      category: injection
      asvs: ["V1"]
      confidence: HIGH
      references:
        - "campaign cluster: CWE-78 OS Command Injection (371 findings, 317 repos)"
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'

  - id: traust-python-injection-request-to-shell-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value reaches a shell/subprocess call — the caller
      controls command content. Validate strictly and pass an argument
      vector. CWE-78.
    metadata:
      cwe: ["CWE-78"]
      category: injection
      asvs: ["V1"]
      confidence: HIGH
      references:
        - "campaign cluster: CWE-78 OS Command Injection (371 findings, 317 repos)"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.json[...]
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.Popen(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_output(...)
          - pattern: os.system(...)

  - id: traust-python-injection-raw-sql-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value reaches a raw SQL execution point — string
      SQL built from user input is injectable regardless of the ORM
      around it. Use parameterized queries (execute(sql, params)) or ORM
      lookups. CWE-89.
    metadata:
      cwe: ["CWE-89"]
      category: injection
      asvs: ["V5"]
      confidence: HIGH
      references:
        - "seeded: language-coverage plan W1a; Django/DRF raw-SQL shape"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.data[...]
          - pattern: request.query_params.get(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $CURSOR.execute($SQL)
          - pattern: $CURSOR.executemany($SQL)
          - pattern: RawSQL(...)
          - pattern: $QS.raw(...)
          - pattern: $QS.extra(...)

  - id: traust-python-injection-jinja2-template-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value is compiled as a Jinja2 template outside a
      sandbox — template injection executes attacker expressions
      server-side (lookup/attribute chains reach os and subprocess).
      Render user data as a VARIABLE, or use
      jinja2.sandbox.ImmutableSandboxedEnvironment when user-authored
      templates are a feature. CWE-1336.
    metadata:
      cwe: ["CWE-1336", "CWE-94"]
      category: injection
      asvs: ["V5"]
      confidence: HIGH
      references:
        - "seeded: language-coverage plan W1a; AWX probe sanitize_jinja context"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.data[...]
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.json[...]
    pattern-sinks:
      - pattern-either:
          - pattern: jinja2.Template(...)
          - pattern: jinja2.Environment(...).from_string(...)
