rules:
  - id: traust-bash-cryptography-cosign-classical-signing
    languages: [bash]
    severity: INFO
    message: >-
      cosign artifact signing in a release/CI path — sigstore signatures
      are ECDSA-based (classical, Shor-vulnerable) and release artifacts
      carry multi-year verification lifetimes, which makes this
      harvest-now/verify-later relevant under the NIST IR 8547 2035
      transition. Not a defect today: inventory it, tag the finding
      pqc_classification=shor-signature, and track the sigstore PQC
      roadmap. CWE-327.
    metadata:
      cwe: ["CWE-327"]
      category: cryptography
      asvs: ["V11"]
      confidence: HIGH
      pqc_classification: shor-signature
      references:
        - "PQC pilot calibration 2026-07-18: HP_SIGN_COSIGN — command-verb anchored after the bare-'sigstore' pattern produced 38/38 FPs on docstrings/lockfiles"
    patterns:
      - pattern-either:
          - pattern: cosign sign ...
          - pattern: cosign sign-blob ...
          - pattern: cosign attest ...
          - pattern: cosign generate-key-pair ...
