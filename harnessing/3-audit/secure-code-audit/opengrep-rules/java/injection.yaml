rules:
  - id: traust-java-injection-sql-concat
    languages: [java]
    severity: ERROR
    message: >-
      SQL statement built by string concatenation and handed to a JDBC
      execute call — any interpolated value becomes SQL syntax. Use a
      PreparedStatement with bind parameters for every variable part.
      CWE-89; SEI CERT IDS00-J.
    metadata:
      cwe: ["CWE-89"]
      category: injection
      asvs: ["V1"]
      cert: ["IDS00-J"]
      confidence: HIGH
      references:
        - "seed rule: SEI CERT Oracle Coding Standard for Java, IDS00-J (cited by ID; pattern and text original to this pack)"
        - "provenance: Java tranche seeded 2026-07-20 (2026-07 Java batch coverage gap); calibration pending /mine-ledger"
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery("..." + $X)
          - pattern: $STMT.executeQuery("..." + $X + "...")
          - pattern: $STMT.executeUpdate("..." + $X)
          - pattern: $STMT.executeUpdate("..." + $X + "...")
          - pattern: $STMT.execute("..." + $X)
          - pattern: $STMT.execute("..." + $X + "...")
          - pattern: $CONN.prepareStatement("..." + $X)
          - pattern: $CONN.prepareStatement("..." + $X + "...")
          - pattern: $EM.createNativeQuery("..." + $X)
          - pattern: $EM.createNativeQuery("..." + $X + "...")

  - id: traust-java-injection-exec-concat
    languages: [java]
    severity: ERROR
    message: >-
      OS command built by string concatenation and executed — interpolated
      values become shell/argument syntax. Pass a fixed program with an
      argument array (ProcessBuilder list form) and validate each argument.
      CWE-78; SEI CERT IDS07-J.
    metadata:
      cwe: ["CWE-78"]
      category: injection
      asvs: ["V1"]
      cert: ["IDS07-J"]
      confidence: HIGH
      references:
        - "seed rule: SEI CERT Oracle Coding Standard for Java, IDS07-J (cited by ID; pattern and text original to this pack)"
        - "provenance: Java tranche seeded 2026-07-20 (2026-07 Java batch coverage gap); calibration pending /mine-ledger"
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec("..." + $X)
          - pattern: Runtime.getRuntime().exec("..." + $X + "...")
          - pattern: $RT.exec("..." + $X)
          - pattern: $RT.exec("..." + $X + "...")
          - pattern: new ProcessBuilder("sh", "-c", "..." + $X)
          - pattern: new ProcessBuilder("bash", "-c", "..." + $X)
          - pattern: new ProcessBuilder("cmd", "/c", "..." + $X)
