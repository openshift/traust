#
# rpm dist-git watch list — operator-curated input for the dist-git
# leg of build_release_events.py (threat-model skill) (continuous-operations event
# feeder; docs/continuous-operations.md "Event feeders").
#
# Each entry under `active` is one dist-git repository to watch. On
# every feeder run, `git ls-remote -- <url> HEAD` (https-only: the
# feeder rejects any non-https URL before touching the network, pins
# GIT_ALLOW_PROTOCOL=https, and separates the URL with `--` — rule S3)
# is compared against the recorded HEAD in
# analysis-results/findings/_manifest/release-events-state.json; a
# moved HEAD appends one `source: "release"` event to
# rescan-events.jsonl noting "dist-git commit — route
# secure-rpm-audit". The first observation of a URL only records its
# HEAD (baseline, no event). Unreachable or erroring repos are skipped
# and counted — a network failure never crashes the feeder and never
# fabricates an event.
#
# This file ships as a documented EXAMPLE with an empty active list:
# which packaging repos deserve standing watch is an operator decision
# (typically the packages whose RPMs the portfolio ships or builds
# on). Uncomment or add entries to activate. CentOS Stream dist-git
# examples:
#
# active:
#   - https://gitlab.com/redhat/centos-stream/rpms/openssl.git
#   - https://gitlab.com/redhat/centos-stream/rpms/kernel.git
#   - https://gitlab.com/redhat/centos-stream/rpms/systemd.git

active: []
