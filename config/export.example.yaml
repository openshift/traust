# export.yaml — one-shot public export of the Traust repositories.
#
# Copy to $TRAUST_CONFIG_HOME/export.yaml and fill in your values. Read by
# `python3 -m traust.migrations.export_public_tree`, which produces a fresh
# publication tree per repository from the tracked files of a working
# checkout: strips build plumbing that never ships, rewrites dependency pins
# and links from the private forge to the public one, truncates the CHANGELOG
# at the export boundary, initialises a fresh git history, and runs the
# pre-publication scrub gate on the result. It never touches the source
# checkout and never pushes.

# Where the public repositories live. Pins and links that start with any
# `private_base_urls` entry are rewritten to `<public_base_url>/<repo>`.
public_base_url: https://github.com/example-org
private_base_urls:
  - ssh://git@git.example.internal/example-group
  - https://git.example.internal/example-group

# Repositories to export, in dependency order: a repo's git-tag pins can only
# resolve once the repos it pins are published.
repos:
  - traust-contracts
  - traust-ledger
  - traust-engine
  - traust
  - traust-sdk

# Paths removed from every exported tree (relative, directory entries end in
# "/"). Your CI/build plumbing belongs here — it names your infrastructure and
# would not work anywhere else.
strip:
  - .tekton/
  - .gitlab-ci.yml
  - ci/install-editable.sh
  - rpms.in.yaml
  - rpms.lock.yaml

# CHANGELOG handling: `truncate` replaces the file with a provenance note and
# the version at export; `keep` leaves it as is.
changelog:
  mode: truncate
  note: >-
    This repository's history begins at its public release. Earlier
    development happened in a private tree; its changelog is not part of the
    public record.

# Author of the single export commit in each fresh history.
commit_author: "Traust maintainers <maintainers@example.org>"
