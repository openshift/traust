# Template for $TRAUST_CONFIG_HOME/budget-policy.yaml — install_traust seeds it;
# copy there and edit. The harness never reads this example at run time.
#
# Budget policy — spend governance for harness runs.
#
# ⚠️ STATUS: POLICY ARTIFACT ONLY — NOT ENFORCED YET.
# The only consumer today is build_spend_dashboard.py, which reads the
# `monthly_budget` block for the visibility layer (L2: budget-vs-actual
# tracking) — it never gates a run. Enforcement lands in
# stages: advisory
# checks in batch drivers first (Layer 1), hard enforcement on the
# central agentic platform (Layer 4) where users cannot edit the
# policy. Numbers below are PLACEHOLDERS — anchor yours to observed
# session actuals (metrics ledger source model-spend:sessions) after the
# first calibrated batch.
#
# Companion pieces:
#   python3 -m traust.cli registry models      — tier floors (never enforce a
#                                    degrade below a role's floor)
#   python3 -m traust.cli metrics collect-spend — actuals the policy is judged by
#   your calibration record — where the numbers come from

budget_policy:
  version: 1
  approved: 1970-01-01        # date the budget owner blessed the bands
                              # and ceilings. Blessing the NUMBERS does
                              # not enable enforcement — a separate
                              # decision flips `enforcement`.
  enforcement: observe       # none | observe | advisory | enforced
                             # `observe` = shadow accounting only: the
                             # verdict is computed and recorded, NOTHING
                             # is ever withheld. Layer-1 flips
                             # this to `advisory`; only the central
                             # platform may set `enforced`.
  units: output_tokens       # stable cross-model unit until the registry
                             # carries a full rate card; cache-read input
                             # is tracked separately and priced ~10x lower

  monthly_budget:            # dollar plan for the spend dashboard's
                             # budget-vs-actual tracking (visibility
                             # layer L2 only — never gates a run).
                             # Source of the numbers: your cost report.
    usd_central: 10000
    usd_band_low: 8000
    usd_band_high: 12000
    note: >-
      Placeholder band. Revise alongside your cost report, not
      independently.

  per_run_defaults:          # ceiling per single skill invocation
    secure-code-audit:  2_500_000
    triage:             1_500_000
    verify-remediation:   800_000
    remediate-finding:  1_500_000
    default:            1_000_000

  per_batch_default:   12_000_000   # 4-repo batch + orchestrator overhead
  per_day_campaign:   150_000_000   # ~1.5x the observed busiest day

  bands:                     # action at N x the pre-run estimate
    - at: 1.5
      action: warn           # log to the spend ledger, continue
    - at: 2.0
      action: degrade        # drop to the cheapest model the registry
                             # tier-FLOOR allows — never below floor;
                             # ledger-validity writer roles keep their
                             # mandated tier regardless
    - at: 3.0
      action: refuse         # stop; emit partial report stamped
                             # degraded=true; record estimate-vs-actual

  estimate_required: batch   # batch drivers refuse to START without an
                             # estimate; single-repo runs warn only

  override:
    flag: --budget-override
    requires_reason: true    # reason string mandatory
    ledger_source: budget-override   # every use is a hash-chained row

  layered_model:             # where each guarantee lives (see plan)
    l1_policy: this file, enforced client-side by drivers (bypassable)
    l2_visibility: spend ledger + dashboard; declared-vs-actual drift
    l3_billing_backstop: workspace/API-key spend limits per service
      account (admin-set; the harness cannot grant exceptions)
    l4_central_enforcement: central agentic platform runs the policy
      check server-side; the only layer that is non-bypassable per-run
